name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Testene skal bestå før en release kan blive til noget. En tagget
      # version er det eneste der nogensinde rammer serveren.
      - run: npm test

      - run: ./scripts/release.sh

      # ubuntu-latest er linux-x64, samme som LXC'en — den prebuildede
      # better-sqlite3-binær passer derfor direkte.
      - name: Pak tarball
        run: tar -C release -czf spil-release-linux-x64.tar.gz .

      - uses: softprops/action-gh-release@v2
        with:
          files: spil-release-linux-x64.tar.gz
          generate_release_notes: true
