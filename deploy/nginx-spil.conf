server {
  listen 80;
  server_name _;

  root /var/www/spil;
  index index.html;

  # TLS termineres i nginxproxymanager (CT 104). Der er bevidst ingen TLS her.
  client_max_body_size 16M;

  location /api/ {
    proxy_pass http://127.0.0.1:5060/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Uden den her ser Express aldrig at forbindelsen udefra var HTTPS, og
    # secure-cookien bliver aldrig sat.
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Spilcovers og partifotos. Ligger på datamappen, ikke i releasen, så de
  # overlever en opdatering.
  location /uploads/ {
    alias /var/lib/spil/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # SPA-fallback: alle ruter serveres af index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Service worker og manifest må aldrig caches — ellers kan en klient sidde
  # fast på en gammel version i timevis efter en opdatering.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }
  location = /version.json {
    add_header Cache-Control "no-cache";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Vite-byggede assets har indholdshash i navnet og kan caches for evigt.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }
}
